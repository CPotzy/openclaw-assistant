name: Build Fork APK

on:
  push:
    branches: [custom-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_ENABLED: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-assistant-custom
          path: app/build/outputs/apk/standard/debug/*.apk
